<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Snake</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --grid: #1d212a;
    --snake: #4ade80;
    --head: #22c55e;
    --food: #f43f5e;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --btn: #262b36;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    overscroll-behavior: none; touch-action: none; user-select: none;
  }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
  .hud { display: flex; justify-content: space-between; width: min(92vw, 420px); font-weight: 600; }
  .hud span { color: var(--muted); font-weight: 400; }
  .wrap { position: relative; }
  canvas { display: block; background: var(--panel); border-radius: 12px; width: min(92vw, 420px); height: min(92vw, 420px); }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; background: rgba(15,17,21,.82); border-radius: 12px; text-align: center; padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay h1 { margin: 0; font-size: 34px; color: var(--snake); letter-spacing: 1px; }
  .overlay p { margin: 0; color: var(--muted); font-size: 14px; }
  button { font: inherit; border: none; color: var(--text); background: var(--btn); border-radius: 10px; cursor: pointer; }
  .start { background: var(--head); color: #052e12; font-weight: 700; padding: 12px 28px; font-size: 17px; margin-top: 6px; }
  .pad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 56px); gap: 8px; }
  .pad button { font-size: 22px; }
  .pad .up { grid-column: 2; grid-row: 1; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  .pad button:active { background: #343a48; }
  @media (hover: hover) and (pointer: fine) { .pad { display: none; } }
</style>
</head>
<body>
  <div class="hud">
    <div>Punkte: <b id="score">0</b></div>
    <div><span>Rekord:</span> <b id="best">0</b></div>
  </div>

  <div class="wrap">
    <canvas id="c" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h1 id="title">SNAKE</h1>
      <p id="msg">Wischen, Pfeiltasten oder WASD · Leertaste = Pause</p>
      <button class="start" id="startBtn">Start</button>
    </div>
  </div>

  <div class="pad">
    <button class="up" data-d="up">▲</button>
    <button class="left" data-d="left">◀</button>
    <button class="down" data-d="down">▼</button>
    <button class="right" data-d="right">▶</button>
  </div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const msgEl = document.getElementById('msg');
  const startBtn = document.getElementById('startBtn');

  const N = 20;                 // Felder pro Seite
  const S = canvas.width / N;   // Feldgröße
  const DIRS = { up: [0,-1], down: [0,1], left: [-1,0], right: [1,0] };

  let snake, dir, queue, food, score, best = 0, speed, running = false, paused = false, timer = null;

  function loadBest() {
    try { best = parseInt(localStorage.getItem('snake_best') || '0', 10) || 0; } catch (e) {}
    bestEl.textContent = best;
  }
  function saveBest() { try { localStorage.setItem('snake_best', best); } catch (e) {} }

  function reset() {
    snake = [{x:9,y:10},{x:8,y:10},{x:7,y:10}];
    dir = 'right'; queue = [];
    score = 0; speed = 130;
    scoreEl.textContent = 0;
    placeFood();
  }

  function placeFood() {
    const free = [];
    for (let x = 0; x < N; x++) for (let y = 0; y < N; y++)
      if (!snake.some(p => p.x === x && p.y === y)) free.push({x,y});
    food = free[Math.floor(Math.random() * free.length)];
  }

  function opposite(a, b) {
    return DIRS[a][0] === -DIRS[b][0] && DIRS[a][1] === -DIRS[b][1];
  }

  function turn(d) {
    if (!running || paused) return;
    const last = queue.length ? queue[queue.length - 1] : dir;
    if (d !== last && !opposite(d, last) && queue.length < 3) queue.push(d);
  }

  function step() {
    if (queue.length) dir = queue.shift();
    const [dx, dy] = DIRS[dir];
    const head = { x: snake[0].x + dx, y: snake[0].y + dy };

    const eating = food && head.x === food.x && head.y === food.y;
    const body = eating ? snake : snake.slice(0, -1);

    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N ||
        body.some(p => p.x === head.x && p.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);
    if (eating) {
      score++;
      scoreEl.textContent = score;
      if (score > best) { best = score; bestEl.textContent = best; saveBest(); }
      speed = Math.max(60, 130 - score * 3);
      if (snake.length === N * N) return win();
      placeFood();
    } else {
      snake.pop();
    }
    draw();
    timer = setTimeout(step, speed);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.fillStyle = '#181b22';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#1d212a';
    for (let x = 0; x < N; x++) for (let y = 0; y < N; y++)
      if ((x + y) % 2 === 0) ctx.fillRect(x * S, y * S, S, S);

    if (food) {
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.arc(food.x * S + S/2, food.y * S + S/2, S * 0.38, 0, Math.PI * 2);
      ctx.fill();
    }

    snake.forEach((p, i) => {
      ctx.fillStyle = i === 0 ? '#22c55e' : '#4ade80';
      roundRect(p.x * S + 1.5, p.y * S + 1.5, S - 3, S - 3, 5);
      ctx.fill();
    });

    // Augen
    const h = snake[0], [dx, dy] = DIRS[dir];
    const cx = h.x * S + S/2, cy = h.y * S + S/2;
    const ox = dy !== 0 ? S * 0.2 : 0, oy = dx !== 0 ? S * 0.2 : 0;
    ctx.fillStyle = '#052e12';
    [[1],[-1]].forEach(([k]) => {
      ctx.beginPath();
      ctx.arc(cx + dx * S * 0.18 + ox * k, cy + dy * S * 0.18 + oy * k, 2.2, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function start() {
    clearTimeout(timer);
    reset();
    running = true; paused = false;
    overlay.classList.add('hidden');
    draw();
    timer = setTimeout(step, speed);
  }

  function showOverlay(t, m, b) {
    titleEl.textContent = t; msgEl.textContent = m; startBtn.textContent = b;
    overlay.classList.remove('hidden');
  }

  function gameOver() {
    running = false; clearTimeout(timer);
    showOverlay('Game Over', 'Punkte: ' + score + ' · Rekord: ' + best, 'Nochmal');
  }

  function win() {
    running = false; clearTimeout(timer); draw();
    showOverlay('Gewonnen!', 'Das ganze Feld ist voll – ' + score + ' Punkte', 'Nochmal');
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) { clearTimeout(timer); showOverlay('Pause', 'Punkte: ' + score, 'Weiter'); }
    else { overlay.classList.add('hidden'); timer = setTimeout(step, speed); }
  }

  startBtn.addEventListener('click', () => (running && paused) ? togglePause() : start());

  const KEYS = {
    ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
    w:'up', s:'down', a:'left', d:'right', W:'up', S:'down', A:'left', D:'right'
  };
  document.addEventListener('keydown', e => {
    if (KEYS[e.key]) { e.preventDefault(); turn(KEYS[e.key]); }
    else if (e.key === ' ' || e.key === 'p' || e.key === 'Escape') {
      e.preventDefault();
      if (!running) start(); else togglePause();
    } else if (e.key === 'Enter' && !running) start();
  });

  document.querySelectorAll('.pad button').forEach(b => {
    b.addEventListener('touchstart', e => { e.preventDefault(); turn(b.dataset.d); }, { passive: false });
    b.addEventListener('mousedown', () => turn(b.dataset.d));
  });

  // Wischgesten
  let tx = null, ty = null;
  document.addEventListener('touchstart', e => {
    if (e.target.closest('button')) return;
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (tx === null) return;
    const dx = e.touches[0].clientX - tx, dy = e.touches[0].clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', () => { tx = ty = null; });

  loadBest();
  reset();
  draw();
})();
</script>
</body>
</html>
